# ⛔ 비활성화됨 — SNS 계정 제거 결정 (2026-05-17)
# 원칙: SNS 계정 연동 없음. 명의: 김덕진.
# 필요시 workflow_dispatch 로만 수동 실행 가능.
name: 새론금융_AI_콘텐츠_생성 (수동전용)

on:
  workflow_dispatch:   # 수동 실행만 허용. 자동 스케줄 없음.

jobs:
  ai-sns-agent:
    name: AI SNS 자동 게시
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 코드 다운로드
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ai-agent/package.json'

      # 3. 의존성 설치
      - name: 패키지 설치
        working-directory: ./ai-agent
        run: npm ci --production

      # 4. AI 에이전트 실행
      - name: AI 에이전트 실행
        working-directory: ./ai-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_CHANNEL_ID: ${{ secrets.KAKAO_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            node master-agent.js --test
          else
            node master-agent.js
          fi

      # 5. 생성된 콘텐츠 로그 저장
      - name: 로그 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-logs-${{ github.run_number }}
          path: ai-agent/logs/
          retention-days: 30

      # 6. 실패 시 텔레그램 알림
      - name: 실패 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"🚨 새론금융 AI 에이전트 실행 실패!\nGitHub Actions에서 확인해주세요.\nhttps://github.com/HeeJeonLee/saeloan-financial/actions"}'
