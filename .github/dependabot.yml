# Dependabot — 패키지 자동 업데이트
# ============================================
# 매주 월요일 오전 9시(한국시간)에 자동으로
# 최신 버전 확인 → PR 생성
# → GitHub에서 "Merge" 클릭 한 번으로 업데이트 완료
# ============================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /ai-agent
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    labels:
      - "auto-update"
    commit-message:
      prefix: "chore"
