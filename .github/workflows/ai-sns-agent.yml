# 새론금융대부중개 — AI 자동화 에이전트
# =====================================================
# 매일 오전 9시 (평일) 자동 실행
# Claude AI로 Instagram 콘텐츠 생성 → 자동 게시
# 완료 시 Telegram 알림 → 이희전 폰으로 수신
#
# 토큰 미설정 시: 파일 저장만 됨 (오류 없이 실행)
# 토큰 설정 완료 시: Instagram 자동 게시 시작
# =====================================================

name: 새론금융_AI_자동화_에이전트

on:
  schedule:
    # 평일 오전 9시 KST (= UTC 00:00)
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    # 수동 실행 (GitHub Actions 탭에서 "Run workflow" 클릭)

jobs:
  run-agent:
    name: AI 콘텐츠 생성 & Instagram 게시
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 코드 다운로드
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 20 설치
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ai-agent/package.json"

      # 3. 패키지 설치
      - name: 패키지 설치
        working-directory: ./ai-agent
        run: npm install

      # 4. AI SDK 자동 업데이트 (항상 최신 Claude 버전 사용)
      - name: Anthropic SDK 최신화
        working-directory: ./ai-agent
        run: npm update @anthropic-ai/sdk

      # 5. AI 에이전트 실행
      - name: AI 에이전트 실행
        working-directory: ./ai-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OG_IMAGE_BASE_URL: ${{ secrets.OG_IMAGE_BASE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
        run: node master-agent.js

      # 6. 생성된 파일 GitHub에 자동 저장 (백업)
      - name: 생성 파일 커밋 & 저장
        working-directory: ./ai-agent
        run: |
          git config user.name "saeloan-ai-agent"
          git config user.email "ai@saeloan.co.kr"
          git add generated/ logs/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: $(date '+%Y-%m-%d') AI 콘텐츠 생성"
          git push 2>/dev/null || true
